
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARCADE ARENA - Clicker Game</title>
  <meta name="description" content="Play ARCADE ARENA! Click for coins, buy packs and collect characters.">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>🎮 ARCADE ARENA</h1>
    <p>Click, collect and become a legend!</p>
  </header>

  <main>
    <section class="coin-area">
      <h2>🪙 <span id="coins">1000</span> Coins</h2>

      <button id="clickButton" onclick="clickCoin()">
        🪙 CLICK ME!
      </button>

      <div id="floatingRewards"></div>
      <p>Click to earn coins!</p>

      <button id="upgradeButton" onclick="buyUpgrade()">
        Upgrade Click Power — 50 Coins
      </button>

      <p>Click power: <span id="power">1</span></p>

      <div class="admin-controls" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="adminButton" onclick="openAdmin()">
          🔐 ADMIN
        </button>

        <button id="luckButton" onclick="toggleLuck()">
          🍀 LUCK MODE: OFF
        </button>
      </div>
    </section>

    <section>
      <h2>🎁 PACK SHOP</h2>
      <div id="packShop" class="pack-grid"></div>
    </section>

    <section>
      <h2>✨ PACK REVEAL</h2>
      <div id="reveal">
        Buy a pack to discover a character!
      </div>
    </section>

    <section>
      <h2>📖 COLLECTION INDEX</h2>
      <div id="collection"></div>
    </section>

    <p id="message"></p>
  </main>

  <footer>
    <p>ARCADE ARENA © 2026</p>
  </footer>
 <script src="script.js?v=3"></script>
</body>
</html>
